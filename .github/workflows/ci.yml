name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "${{ matrix.node }}"}
      - run: npm run check
      - run: npm test

  codex-real-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - run: npm run check
      - name: Install current official Codex
        run: npm install --no-save @openai/codex@latest
      - name: Record current Codex version
        run: npx codex --version
      - name: Full real Codex app-server + plugin + model catalog + gateway E2E
        env:
          CODEX_BIN: ${{ github.workspace }}/node_modules/.bin/codex
        run: node scripts/real-codex-e2e.mjs

  cleanup-validation-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, codex-real-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Remove temporary validation branch if it still exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/delete.json -w '%{http_code}' -L -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/git/refs/heads/validation/codex-native-e2e")"
          if [ "$code" != "204" ] && [ "$code" != "404" ] && [ "$code" != "422" ]; then
            cat /tmp/delete.json >&2
            echo "unexpected branch-delete HTTP status $code" >&2
            exit 1
          fi
