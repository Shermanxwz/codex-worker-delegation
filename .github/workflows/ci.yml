name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "${{ matrix.node }}"}
      - run: npm run check
      - name: Deterministic bounded test suite
        run: npm test

  test-parallel-stress:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "24"}
      - run: npm run check
      - name: Parallel process-isolation stress suite
        run: npm run test:parallel

  codex-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - run: npm run check
      - name: Install current official Codex package
        run: npm install --no-save @openai/codex
      - name: Verify current Codex and app-server schema
        run: |
          npx codex --version
          rm -rf /tmp/codex-schema
          npx codex app-server generate-json-schema --out /tmp/codex-schema
          test -n "$(find /tmp/codex-schema -type f -print -quit)"
      - name: Real Codex plugin manager + app-server cross-provider E2E
        env:
          CODEX_BIN: ${{ github.workspace }}/node_modules/.bin/codex
        run: node scripts/real-codex-e2e.mjs

  deployment-contract:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - name: Install current official Codex package
        run: npm install --no-save @openai/codex
      - name: Exercise user install, service entry, upgrade, rollback, validation, and uninstall
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/cwd-home"
          export CODEX_HOME="$HOME/.codex"
          export CWD_INSTALL_ROOT="$HOME/.local/share/codex-worker-delegation"
          export CODEX_BIN="$GITHUB_WORKSPACE/node_modules/.bin/codex"
          export CWD_NODE_BIN="$(command -v node)"
          export CWD_SYSTEMD_SCOPE=user
          export CWD_INSTALL_NO_SYSTEMD=1
          mkdir -p "$CODEX_HOME"
          printf '%s\n' '{"tokens":{"access_token":"CI-PRESERVE"}}' > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          auth_before="$(sha256sum "$CODEX_HOME/auth.json" | cut -d ' ' -f1)"

          CWD_RELEASE_ID=ci-first bash scripts/install-linux.sh
          CWD_RELEASE_ID=ci-second bash scripts/install-linux.sh
          test "$(cat "$CWD_INSTALL_ROOT/current/.release-id")" = ci-second
          test "$(cat "$CWD_INSTALL_ROOT/previous/.release-id")" = ci-first
          test "$(cat "$CWD_INSTALL_ROOT/systemd-scope")" = user
          test -f "$CWD_INSTALL_ROOT/runtime/node"
          test ! -L "$CWD_INSTALL_ROOT/runtime/node"

          unit="$HOME/.config/systemd/user/codex-worker-delegation.service"
          systemd-analyze verify "$unit"
          ! grep -q '^User=' "$unit"
          grep -Fqx "Environment=HOME=$HOME" "$unit"
          grep -Fqx "Environment=CODEX_HOME=$CODEX_HOME" "$unit"

          CWD_PORT=8878 "$CWD_INSTALL_ROOT/current/scripts/service-entry.sh" >/tmp/cwd-service-entry.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl --silent --fail --max-time 1 http://127.0.0.1:8878/api/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl --silent --fail --max-time 2 http://127.0.0.1:8878/api/health
          kill "$service_pid"
          wait "$service_pid" || true
          trap - EXIT

          bash "$CWD_INSTALL_ROOT/current/scripts/rollback-linux.sh"
          test "$(cat "$CWD_INSTALL_ROOT/current/.release-id")" = ci-first
          test "$(cat "$CWD_INSTALL_ROOT/previous/.release-id")" = ci-second
          bash "$CWD_INSTALL_ROOT/current/scripts/validate-deployment.sh"

          bash "$CWD_INSTALL_ROOT/current/scripts/uninstall-linux.sh"
          auth_after="$(sha256sum "$CODEX_HOME/auth.json" | cut -d ' ' -f1)"
          test "$auth_before" = "$auth_after"
          ! grep -q 'codex_worker_gateway' "$CODEX_HOME/config.toml"
          test ! -e "$unit"

  deployment-root-contract:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - name: Install current official Codex package
        run: npm install --no-save @openai/codex
      - name: Exercise first-class root install, service entry, rollback, validation, and uninstall
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(command -v node)"
          codex_bin="$GITHUB_WORKSPACE/node_modules/.bin/codex"
          root_home="$RUNNER_TEMP/cwd-root-home"
          root_systemd="$RUNNER_TEMP/cwd-root-systemd"
          sudo env \
            HOME="$root_home" \
            CODEX_HOME="$root_home/.codex" \
            CWD_INSTALL_ROOT="$root_home/.local/share/codex-worker-delegation" \
            CWD_SYSTEMD_SCOPE=system \
            CWD_SYSTEMD_DIR="$root_systemd" \
            CWD_INSTALL_NO_SYSTEMD=1 \
            CWD_NODE_BIN="$node_bin" \
            CODEX_BIN="$codex_bin" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash --noprofile --norc -euxo pipefail -c '
              mkdir -p "$CODEX_HOME"
              printf "%s\n" "{\"tokens\":{\"access_token\":\"ROOT-CI-PRESERVE\"}}" > "$CODEX_HOME/auth.json"
              chmod 600 "$CODEX_HOME/auth.json"
              auth_before="$(sha256sum "$CODEX_HOME/auth.json" | cut -d " " -f1)"

              CWD_RELEASE_ID=root-ci-first bash "$GITHUB_WORKSPACE/scripts/install-linux.sh"
              CWD_RELEASE_ID=root-ci-second bash "$GITHUB_WORKSPACE/scripts/install-linux.sh"
              test "$(cat "$CWD_INSTALL_ROOT/current/.release-id")" = root-ci-second
              test "$(cat "$CWD_INSTALL_ROOT/previous/.release-id")" = root-ci-first
              test "$(cat "$CWD_INSTALL_ROOT/systemd-scope")" = system
              test -f "$CWD_INSTALL_ROOT/runtime/node"
              test ! -L "$CWD_INSTALL_ROOT/runtime/node"

              unit="$CWD_SYSTEMD_DIR/codex-worker-delegation.service"
              systemd-analyze verify "$unit"
              grep -Fxq "User=root" "$unit"
              grep -Fxq "Group=root" "$unit"
              grep -Fxq "Environment=HOME=$HOME" "$unit"
              grep -Fxq "Environment=CODEX_HOME=$CODEX_HOME" "$unit"

              CWD_PORT=8879 "$CWD_INSTALL_ROOT/current/scripts/service-entry.sh" >/tmp/cwd-root-service-entry.log 2>&1 &
              service_pid=$!
              trap "kill $service_pid 2>/dev/null || true" EXIT
              for _ in $(seq 1 40); do
                if curl --silent --fail --max-time 1 http://127.0.0.1:8879/api/health >/dev/null 2>&1; then break; fi
                sleep 0.25
              done
              curl --silent --fail --max-time 2 http://127.0.0.1:8879/api/health
              kill "$service_pid"
              wait "$service_pid" || true
              trap - EXIT

              bash "$CWD_INSTALL_ROOT/current/scripts/rollback-linux.sh"
              test "$(cat "$CWD_INSTALL_ROOT/current/.release-id")" = root-ci-first
              test "$(cat "$CWD_INSTALL_ROOT/previous/.release-id")" = root-ci-second
              bash "$CWD_INSTALL_ROOT/current/scripts/validate-deployment.sh"

              bash "$CWD_INSTALL_ROOT/current/scripts/uninstall-linux.sh"
              auth_after="$(sha256sum "$CODEX_HOME/auth.json" | cut -d " " -f1)"
              test "$auth_before" = "$auth_after"
              ! grep -q "codex_worker_gateway" "$CODEX_HOME/config.toml"
              test ! -e "$unit"
            '

  chatgpt-linux-baseline:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - name: Load immutable ChatGPT Linux baseline
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync('deploy/chatgpt-linux-baseline.json', 'utf8'));
          console.log(`BASELINE_URL=${b.package.versionedUrl}`);
          console.log(`BASELINE_SHA256=${b.package.sha256}`);
          console.log(`BASELINE_VERSION=${b.package.version}`);
          console.log(`BASELINE_CODEX_VERSION=${b.bundledCodex.version}`);
          NODE
      - name: Download and verify immutable ChatGPT Linux baseline
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BASELINE_URL" --output /tmp/chatgpt_baseline.deb
          echo "$BASELINE_SHA256  /tmp/chatgpt_baseline.deb" | sha256sum --check --strict
          test "$(dpkg-deb -f /tmp/chatgpt_baseline.deb Version)" = "$BASELINE_VERSION"
          {
            echo "url=$BASELINE_URL"
            echo "sha256=$BASELINE_SHA256"
            dpkg-deb --info /tmp/chatgpt_baseline.deb
          } | tee /tmp/chatgpt-baseline-evidence.txt
      - name: Execute bundled baseline Codex and generate App Server schema
        run: |
          set -euo pipefail
          rm -rf /tmp/chatgpt-baseline-root /tmp/chatgpt-baseline-schema
          mkdir -p /tmp/chatgpt-baseline-root
          dpkg-deb --extract /tmp/chatgpt_baseline.deb /tmp/chatgpt-baseline-root
          BUNDLED=/tmp/chatgpt-baseline-root/usr/lib/chatgpt/resources/codex
          test -x "$BUNDLED"
          actual="$($BUNDLED --version)"
          echo "$actual" | tee -a /tmp/chatgpt-baseline-evidence.txt
          test "$actual" = "$BASELINE_CODEX_VERSION"
          "$BUNDLED" app-server generate-json-schema --out /tmp/chatgpt-baseline-schema
          test -n "$(find /tmp/chatgpt-baseline-schema -type f -print -quit)"
          echo "BASELINE_BUNDLED_CODEX=$BUNDLED" >> "$GITHUB_ENV"
      - name: Real E2E through immutable bundled Codex baseline
        env:
          CODEX_BIN: ${{ env.BASELINE_BUNDLED_CODEX }}
        run: node scripts/real-codex-e2e.mjs | tee -a /tmp/chatgpt-baseline-evidence.txt
      - name: Upload immutable baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-linux-baseline-evidence-${{ github.run_id }}
          path: /tmp/chatgpt-baseline-evidence.txt
          if-no-files-found: error
          retention-days: 90

  chatgpt-linux-latest:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - name: Download current official ChatGPT Linux deb
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_amd64.deb \
            --output /tmp/chatgpt_amd64.deb
          test -s /tmp/chatgpt_amd64.deb
          sha256sum /tmp/chatgpt_amd64.deb | tee /tmp/chatgpt-latest-evidence.txt
          dpkg-deb --info /tmp/chatgpt_amd64.deb | tee -a /tmp/chatgpt-latest-evidence.txt
      - name: Execute current bundled Codex and generate App Server schema
        run: |
          set -euo pipefail
          rm -rf /tmp/chatgpt-root /tmp/chatgpt-schema
          mkdir -p /tmp/chatgpt-root
          dpkg-deb --extract /tmp/chatgpt_amd64.deb /tmp/chatgpt-root
          BUNDLED=/tmp/chatgpt-root/usr/lib/chatgpt/resources/codex
          test -x "$BUNDLED"
          "$BUNDLED" --version | tee -a /tmp/chatgpt-latest-evidence.txt
          "$BUNDLED" app-server generate-json-schema --out /tmp/chatgpt-schema
          test -n "$(find /tmp/chatgpt-schema -type f -print -quit)"
          echo "LATEST_BUNDLED_CODEX=$BUNDLED" >> "$GITHUB_ENV"
      - name: Real E2E through current ChatGPT Linux bundled Codex
        env:
          CODEX_BIN: ${{ env.LATEST_BUNDLED_CODEX }}
        run: node scripts/real-codex-e2e.mjs | tee -a /tmp/chatgpt-latest-evidence.txt
      - name: Verify project discovery contract matches packaged path
        run: |
          grep -F "'/usr/lib/chatgpt/resources/codex'" src/app-server.mjs
          grep -F "CODEX_CLI_PATH" src/app-server.mjs
      - name: Upload latest compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-linux-latest-evidence-${{ github.run_id }}
          path: /tmp/chatgpt-latest-evidence.txt
          if-no-files-found: error
          retention-days: 30
