<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Worker Delegation</title><link rel="stylesheet" href="/styles.css"></head><body>
<main><header><div><p class="eyebrow">CODEX NATIVE CONTROL PLANE</p><h1>Worker Delegation</h1><p>官方 ChatGPT 登录与第三方模型并存。Codex 原生 Subagents + Responses 自动桥接。</p></div><span id="health" class="pill">loading</span></header>
<section class="card"><h2>运行模式</h2><div class="modes"><button data-mode="AUTO">AUTO</button><button data-mode="DELEGATE">DELEGATE</button><button data-mode="MAIN">MAIN</button></div><p id="modeHelp" class="muted"></p></section>
<section class="card"><h2>New API / 第三方模型</h2><div class="grid"><label>Base URL<input id="baseUrl" placeholder="https://api.example.com/v1"></label><label>API Key<input id="apiKey" type="password" placeholder="只在修改时填写"></label><label>协议<select id="protocol"><option value="auto">Auto (/responses → chat fallback)</option><option value="responses">Responses</option><option value="chat">Chat Completions bridge</option></select></label><label>Main model<input id="mainModel"></label><label>Worker model<input id="workerModel"></label><label>Verifier model<input id="verifierModel"></label></div><div class="actions"><button id="save">保存</button><button id="probe" class="secondary">真实探测 Worker 模型</button></div><pre id="probeResult"></pre></section>
<section class="card"><h2>Codex 集成</h2><p class="muted">安装操作只新增 <code>codex_worker_gateway</code> provider 和两个自定义 subagent role；不会修改 <code>auth.json</code>、keyring 或内置 <code>openai</code> provider。</p><div class="actions"><button id="install">安装/刷新原生集成</button><button id="third" class="secondary">Main 使用第三方</button><button id="official" class="secondary">Main 恢复官方 ChatGPT</button></div><pre id="status"></pre></section>
</main><script type="module" src="/app.js"></script></body></html>
